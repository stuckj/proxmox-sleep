name: Build and Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without v prefix, e.g. 1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version from tag or input
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            # Extract version from tag (remove 'v' prefix)
            echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm

      # Written outside the workspace so it cannot be picked up by a later step
      # that globs the checkout, and 600 so nfpm is the only reader.
      - name: Stage the rpm signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          install -m 600 /dev/null "${RUNNER_TEMP}/rpm-signing-key.asc"
          printf '%s\n' "$GPG_PRIVATE_KEY" > "${RUNNER_TEMP}/rpm-signing-key.asc"
          # The key ids that count as ours when checking the signature below.
          # gpg signs with a signing subkey when the key has one, so the id on
          # the signature is not necessarily the primary's.
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "SIGNING_KEY_IDS=$(gpg --list-secret-keys --keyid-format LONG --with-colons \
                | awk -F: '/^(sec|ssb):/ {print $5}' | paste -sd,)" >> "$GITHUB_ENV"

      - name: Build deb package
        run: |
          VERSION=${{ steps.version.outputs.VERSION }} nfpm package --packager deb --target .

      - name: Build rpm package
        env:
          RPM_SIGNING_KEY_FILE: ${{ runner.temp }}/rpm-signing-key.asc
          NFPM_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          VERSION=${{ steps.version.outputs.VERSION }} nfpm package --packager rpm --target .

      # nfpm builds an unsigned rpm and exits 0 when the key file path is empty,
      # so a signing step that silently did nothing looks exactly like success.
      # Every documented dnf install uses gpgcheck=1, which an unsigned package
      # cannot satisfy.
      - name: Assert the rpm is signed
        run: python3 scripts/check-rpm-signature.py --key "$SIGNING_KEY_IDS" ./*.rpm

      - name: Remove the signing key
        if: always()
        run: rm -f "${RUNNER_TEMP}/rpm-signing-key.asc"

      - name: List built packages
        run: ls -la *.deb *.rpm

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: "*.deb"

      - name: Upload rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: "*.rpm"

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.deb
            *.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The repositories are rebuilt from the release assets, so this needs the
  # release to exist. A workflow_dispatch build has no release to serve from and
  # publishes nothing.
  publish-repo:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Scoped to this job, not the workflow: only one pending run is kept per
    # concurrency group, so covering `build` too would let a third tag pushed in
    # quick succession cancel the second one's build and leave that release with
    # no packages attached at all. A cancelled publish is self-healing -- the
    # next one rebuilds from every release asset -- while a cancelled build is
    # not.
    #
    # Two runs replacing the same apt-history assets at once can leave a signed
    # InRelease from one beside a Packages.gz from the other, which fails apt
    # update for everyone until the next successful run. Queued rather than
    # cancelled: a half-finished publish is worse than a delayed one.
    concurrency:
      group: package-repositories
      cancel-in-progress: false
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev createrepo-c gnupg

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          echo "GPG_KEY_ID=$(gpg --list-secret-keys --keyid-format LONG --with-colons \
                | awk -F: '/^sec:/ {print $5; exit}')" >> "$GITHUB_ENV"

          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "use-agent" >> ~/.gnupg/gpg.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          gpgconf --kill gpg-agent

      - name: Rebuild the package repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          DRY_RUN: '0'
          EXPECT_TAG: ${{ github.ref_name }}
        run: bash scripts/rebuild-package-repos.sh "${RUNNER_TEMP}/repobuild"
